apiVersion: apps/v1
kind: Deployment
metadata:
  name: agrigati-web
  namespace: services
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: agrigati-web
  template:
    metadata:
      labels:
        app: agrigati-web
    spec:
      imagePullSecrets:
        - name: agrisetu
      containers:
        - name: agrigati-web
          image: ghcr.io/shanukumarsk/agrigati-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: agrigati-web
  namespace: services
spec:
  selector:
    app: agrigati-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agrigati-web
  namespace: services
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: agrigati.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agrigati-web
                port:
                  number: 80
    - host: www.agrigati.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agrigati-web
                port:
                  number: 80
  tls:
    - hosts:
        - agrigati.com
        - www.agrigati.com
      secretName: agrigati-apex-tls
